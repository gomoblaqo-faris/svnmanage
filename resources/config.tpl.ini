; svnmanage configuration
; Compatible with iF.SVNAdmin's data/config.ini - sections and keys are identical,
; svnmanage-only keys are marked "(svnmanage)". Relative paths are resolved against
; the application root; "./data/..." is resolved against the data directory.

[Common]
; Indicates whether it's the first start of the application (shows the setup wizard).
FirstStart=1
; Folder for automatic timestamped backups taken before every file change.
BackupFolder=./data/backup/
; Number of backups kept per file. (svnmanage)
BackupCount=30
; Trust the user name provided by a reverse proxy / web server
; (REMOTE_USER or X-Forwarded-User). Only enable behind a trusted proxy!
HttpProxyAuth=false
; Idle session timeout in seconds. (svnmanage)
SessionTimeout=3600
; Absolute session length in seconds, whatever the activity. (svnmanage)
SessionMaxLifetime=43200
; Minimum password length for new passwords. (svnmanage)
MinPasswordLength=12
; Failed logins allowed per user+IP and per IP (any user) before a temporary lock,
; and the lock duration. (svnmanage)
LoginMaxAttempts=5
LoginMaxAttemptsPerIp=20
LoginLockSeconds=900
; Only these addresses / CIDR ranges may open svnmanage (comma separated). Empty = everyone.
AllowedNetworks=
; Reverse proxies allowed to set X-Forwarded-For / X-Forwarded-Proto (comma separated).
TrustedProxies=
; Redirect plain HTTP to HTTPS (behind a TLS proxy, list it in TrustedProxies). (svnmanage)
ForceHttps=false
; Two-factor authentication (TOTP): off, optional, admins, all. (svnmanage)
TwoFactor=optional

[Engine:Providers]
; Authenticator. Types: off, basic
AuthenticationStatus=basic
; User view provider. Types: off, passwd, digest, ldap, ad
UserViewProviderType=passwd
; User edit provider. Types: off, passwd, digest
UserEditProviderType=passwd
; Group view provider. Types: off, svnauthfile, ldap, ad
GroupViewProviderType=svnauthfile
; Group edit provider. Types: off, svnauthfile
GroupEditProviderType=svnauthfile
; Access-Path view/edit provider. Types: off, svnauthfile
AccessPathViewProviderType=svnauthfile
AccessPathEditProviderType=svnauthfile
; Repository view/edit provider. Types: off, svnclient
RepositoryViewProviderType=svnclient
RepositoryEditProviderType=svnclient

[ACLManager]
; Web interface role assignments of users.
UserRoleAssignmentFile=./data/userroleassignments.ini

[Subversion]
; The Subversion authorization (authz) file.
SVNAuthFile=

[Repositories:svnclient]
; Folder containing the repositories (local path, no URL).
SVNParentPath=
Description=Repositories
; svn / svnadmin / svnlook executables (plain names use the PATH).
SvnExecutable=svn
SvnAdminExecutable=svnadmin
SvnLookExecutable=
; Additional repository locations can be added as
; [Repositories:svnclient:1] SVNParentPath=... Description=...

[Users:passwd]
; The htpasswd user file.
SVNUserFile=
; Hash for new passwords: bcrypt, apr1, sha1. (svnmanage)
HashAlgorithm=bcrypt

[Users:digest]
SVNUserDigestFile=
SVNDigestRealm=SVN Privat

[Ldap]
HostAddress=ldap://localhost:389/
ProtocolVersion=3
BindDN=
BindPassword=
; Upgrade the connection with StartTLS. (svnmanage)
StartTLS=false
CacheEnabled=false
CacheFile=./data/ldap.cache.json

[Users:ldap]
BaseDN=
SearchFilter=(objectClass=person)
; First attribute is the login / Subversion user name.
Attributes=uid
; e.g. %givenName %sn (%uid)
DisplayNameFormat=

[Groups:ldap]
BaseDN=
SearchFilter=(objectClass=groupOfNames)
Attributes=cn
GroupsToUserAttribute=member
GroupsToUserAttributeValue=distinguishedName

[Ad]
DomainName=example.com
; Comma separated list of domain controllers.
DomainController=
BindUser=
BindPassword=
StartTLS=false

[Groups:ad]
; Only groups whose name matches (wildcard *) are synchronised.
Filter=SVN-*
; Only list users that are (nested) members of a matching group.
StrictMode=false

[Update:ldap]
AutoRemoveUsers=true
AutoRemoveGroups=true

[GUI]
RepositoryDeleteEnabled=false
RepositoryDumpEnabled=false
; Allow loading dump files into repositories. (svnmanage)
RepositoryLoadEnabled=false
AllowUpdateByGui=true
; Placeholders: %1=Repository name; %2=Relative path (no leading slash)
ApacheDirectoryListing=
CustomDirectoryListing=
DefaultLocale=en_US
